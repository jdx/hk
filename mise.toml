min_version = "2026.9.7"

[env]
_.path = ["test/bats/bin", "{{ env.CARGO_TARGET_DIR | default(value='target') }}/debug", "node_modules/.bin"]

[tools]
actionlint    = "latest"
aube          = { version = "latest", minimum_release_age = "0s" }
cargo-msrv    = "latest"
cargo-release = "latest"
communique    = { version = "latest", minimum_release_age = "0s" }
git-cliff     = "latest"
mr-boxington  = { version = "latest", minimum_release_age = "0s" }
node          = "latest"
pkl           = "latest"
prettier      = "latest"
ripgrep       = "latest"
tak           = { version = "latest", minimum_release_age = "0s" }
taplo         = "latest"
uv            = "latest"
vhs           = "latest"

[wrappers.cargo]
command = "mbx"
env     = { MBX_CARGO_SHIM_MODE = "1" }

# Instruction-counted benchmarks (see tak.toml). Needs valgrind for the counts;
# without it tak reports wall clock only and says so, so this still works on
# macOS where there is no usable cachegrind.
[tasks."perf:build"]
run = "mbx build --release"

[tasks.perf]
depends = ["perf:build"]
dir     = "{{config_root}}"
run     = "tak run"

# Same measurement, appended to refs/notes/tak for this commit. Run by the
# `perf` workflow on every push to main; the notes are the history. Safe to run
# locally — nothing leaves the machine until `tak push`.
[tasks."perf:record"]
depends = ["perf:build"]
dir     = "{{config_root}}"
run     = "tak run --record"

[tasks."renovate:post-update"]
description = "Regenerate files derived from JavaScript dependencies"
run         = "./scripts/build_mcp_ui"
