min_version = "2026.9.7"

[env]
_.path = ["test/bats/bin", "{{ env.CARGO_TARGET_DIR | default(value='target') }}/debug", "node_modules/.bin"]

[tools]
# aube, communique and mr-boxington use the github backend instead of the
# registry's packslip backend. packslip reads each repository's
# .well-known/packslip.json through the GitHub API on every install, even with
# the version locked, and every CI job spends those calls from the repository's
# shared 5,000-an-hour GITHUB_TOKEN quota; once it runs out, every job fails at
# `mise install`. The github backend installs from mise.lock's URLs and
# checksums without calling the API.
actionlint                = "latest"
cargo-msrv                = "latest"
cargo-release             = "latest"
git-cliff                 = "latest"
"github:aubepkg/aube"     = { version = "latest", minimum_release_age = "0s" }
"github:jdx/communique"   = { version = "latest", minimum_release_age = "0s" }
"github:jdx/mr-boxington" = { version = "latest", minimum_release_age = "0s" }
node                      = "latest"
pkl                       = "latest"
prettier                  = "latest"
ripgrep                   = "latest"
tak                       = { version = "latest", minimum_release_age = "0s" }
taplo                     = "latest"
uv                        = "latest"
vhs                       = "latest"

[wrappers.cargo]
command = "mbx"
env     = { MBX_CARGO_SHIM_MODE = "1" }

# Instruction-counted benchmarks (see tak.toml). Needs valgrind for the counts;
# without it tak reports wall clock only and says so, so this still works on
# macOS where there is no usable cachegrind.
[tasks."perf:build"]
run = "mbx build --release"

[tasks.perf]
depends = ["perf:build"]
dir     = "{{config_root}}"
run     = "tak run"

# Same measurement, appended to refs/notes/tak for this commit. Run by the
# `perf` workflow on every push to main; the notes are the history. Safe to run
# locally — nothing leaves the machine until `tak push`.
[tasks."perf:record"]
depends = ["perf:build"]
dir     = "{{config_root}}"
run     = "tak run --record"

[tasks."renovate:post-update"]
description = "Regenerate files derived from JavaScript dependencies"
run         = "./scripts/build_mcp_ui"
