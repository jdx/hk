[checks]
before_push = ["mise run render", "mise run lint"]
full        = "mise run test"
lint        = "mise run lint"

[checks.focused]
bats  = "jouet test --cmd -- mise run test:bats test/NAME.bats"
cargo = "mise run pkl:gen && jouet test --cmd -- cargo test --all --all-features NAME"
unit  = "jouet test --affected"
