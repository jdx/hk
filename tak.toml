# Instruction-counted benchmarks, measured by tak (https://github.com/jdx/tak).
#
# Everything here is pure CPU against no input but hk's own command tree: no
# network, no repository state, no pkl. Hermeticity was checked by running each
# with the proxy pointed at a dead port; all succeed unchanged, and `hk usage`
# is byte-identical run to run.
#
# `--version` is deliberately absent. It measures clap rather than hk, and a
# subject that can reach the network retires a different number of instructions
# depending on conditions unrelated to the code under test.

# The fixed cost of any invocation: process start, dynamic linking, and building
# the clap command tree. Every other benchmark here pays it too, so reading them
# against this one separates "hk got slower to start" from "this command's path
# got slower".
[bench.builtins]
cmd = ["./target/release/hk", "builtins"]

# The whole command tree, walked and serialised to ~42KB of KDL. A subcommand
# added with an expensive default shows up here first, and it is the largest
# pure-CPU path hk has that needs no configuration to run.
[bench.usage]
cmd  = ["./target/release/hk", "usage"]
runs = 10

# Warm Pkl evaluation and configuration validation. `env` immediately execs hk
# in the same process, so cachegrind continues measuring the actual binary
# without adding a shell process.
[bench.validate]
cmd = [
  "env",
  "HK_CACHE_DIR=target/tak-cache",
  "HK_CONFIG_DIR=target/tak-config",
  "HK_FILE=benchmark/pgo/hk.pkl",
  "HK_STATE_DIR=target/tak-state",
  "./target/release/hk",
  "validate",
  "--quiet",
]
runs = 10

# Representative all-files hook planning and execution: Git status, file walk,
# overlapping glob filters, batching, file locks, Tokio scheduling, and small
# subprocesses. Stashing is disabled to keep the committed fixture read-only.
[bench.check]
cmd = [
  "env",
  "HK_CACHE_DIR=target/tak-cache",
  "HK_CONFIG_DIR=target/tak-config",
  "HK_FILE=benchmark/pgo/hk.pkl",
  "HK_STATE_DIR=target/tak-state",
  "HK_STASH=false",
  "HK_STASH_UNTRACKED=false",
  "./target/release/hk",
  "check",
  "--all",
  "--quiet",
]
runs = 10

# A cold configuration: no config cache and no pkl package cache, so every
# sample evaluates the Pkl config and writes both caches, as the first run in a
# new clone, a CI job, or after an hk.pkl edit does. The warm `validate`
# benchmark above reads the cache after its first sample and cannot see this
# path. `prepare` runs before every sample, outside the measurement.
#
# The configuration only amends Config.pkl. pkl/Builtins.pkl is generated by
# `mise run pkl:gen`, which the perf runner does not run, so a regression in how
# Builtins.pkl loads (see #1581) is not visible here.
[bench.config-cold]
cmd     = ["./target/release/hk", "validate", "--quiet"]
prepare = ["rm", "-rf", "target/tak-cold-cache", "target/tak-cold-pkl"]
runs    = 5
warmup  = 0

[bench.config-cold.env]
HK_CACHE_DIR     = "target/tak-cold-cache"
HK_CONFIG_DIR    = "target/tak-config"
HK_FILE          = "benchmark/pgo/hk.pkl"
HK_PKL_CACHE_DIR = "target/tak-cold-pkl"
HK_STATE_DIR     = "target/tak-state"

# A pre-commit hook that stashes: 60 staged and 50 unstaged edits, 10 of them
# on the same files, so the run detects what to stash, stashes it, runs a fixer,
# stages, and merges the unstaged edits back. `setup` builds a 400-file
# repository under benchmark/stash/repo once; `prepare` replays the edits before
# every sample (see benchmark/stash/fixture.sh). `check` confirms that all 60
# staged files were fixed and staged and that the 50 unstaged edits came back.
# Without the stash, the fixer's staging would also take the 10 overlapping
# files' unstaged edits, leaving 40, so a run that skipped it cannot pass.
#
# The instruction count covers hk's own process only: tak does not follow child
# processes, so the work done inside the `git` commands hk starts is not in it
# (wall time shows it, ungated). A regression in how many git commands hk starts
# moves the count only by what hk spends starting and parsing them.
[bench.stash]
check   = ["sh", "-c", "test \"$(git diff --cached --name-only | grep -c .)\" -eq 60 && test \"$(git diff --cached | grep -c '^+fixed$')\" -eq 60 && test \"$(git diff --name-only | grep -c .)\" -eq 50"]
cmd     = ["./target/release/hk", "run", "pre-commit"]
dir     = "benchmark/stash/repo"
prepare = ["sh", "-c", "git reset -q --hard clean && git clean -qfd && git apply --index .git/staged.patch && git apply .git/unstaged.patch"]
runs    = 10
setup   = ["./benchmark/stash/fixture.sh", "benchmark/stash/repo"]
warmup  = 1

[bench.stash.env]
GIT_CONFIG_GLOBAL   = "/dev/null"
GIT_CONFIG_NOSYSTEM = "1"
HK_CACHE_DIR        = ".git/hk-cache"
HK_CONFIG_DIR       = ".git/hk-config"
HK_STATE_DIR        = ".git/hk-state"
