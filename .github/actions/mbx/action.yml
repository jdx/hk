name: Set up mbx
description: Use the local Namespace volume or fork-safe GitHub cache backend

inputs:
  backend:
    description: Explicit backend for local Namespace or untrusted GitHub callers
    default: auto
  mirror-github-cache:
    description: Mirror a trusted main build into the restore-only cache used by fork PRs
    default: "false"
  version:
    description: Explicit mbx version for jobs that cannot install project tools first
    required: false
runs:
  using: composite
  steps:
    - name: Mount the local mbx store on the Namespace cache volume
      if: inputs.backend == 'local'
      uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/mbx' || '~/.cache/mbx' }}
    - name: Install mbx for local caching
      if: inputs.backend == 'local'
      shell: bash
      env:
        MBX_VERSION: ${{ inputs.version }}
      run: |
        tool=mr-boxington
        if [[ -n "$MBX_VERSION" ]]; then
          tool="mr-boxington@$MBX_VERSION"
        fi
        mise install "$tool"
        echo "$(mise where "$tool")" >> "$GITHUB_PATH"
        echo "MBX_REMOTE_URL=" >> "$GITHUB_ENV"
        if [[ "$RUNNER_OS" == Linux ]]; then
          echo "MBX_CACHE_LINKS=1" >> "$GITHUB_ENV"
        fi
    - name: Restore the fork PR cache mirror
      if: inputs.mirror-github-cache == 'true' && github.actor == 'jdx' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
      with:
        version: ${{ inputs.version }}
        backend: github
        cache-generation: v2
    - if: inputs.backend != 'local'
      uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
      with:
        version: ${{ inputs.version }}
        cache-generation: v2
        backend: ${{ inputs.backend != 'auto' && inputs.backend || ((github.actor != 'jdx' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login != 'jdx'))) && 'github' || 'local') }}
        server-url: https://cache.mise.jdx.dev
        namespace: jdx/hk
        oidc-audience: https://cache.mise.jdx.dev
