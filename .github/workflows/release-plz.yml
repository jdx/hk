name: release-plz

permissions: {}

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - release-plz

# A running release is never cancelled. No `queue: max`: release-plz acts on the
# SHA it checked out, so the default (one pending run, replaced by the newest
# push) avoids queued runs acting on stale main SHAs.
concurrency:
  group: release-plz
  cancel-in-progress: false

env:
  DRY_RUN: 0

jobs:
  release-plz:
    if: github.repository == 'jdx/hk'
    runs-on: namespace-profile-endev-linux-amd64
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      # release-plz needs persisted credentials so the mise-tasks/release-plz
      # script's `git push --tags` / `git push origin release --force` can
      # authenticate.
      # jactionlint ignore=artipacked
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.HK_GH_TOKEN }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true
          cache: false
      - run: mise trust --all
      - run: mise run release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.HK_GH_TOKEN }}
