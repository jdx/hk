name: docs implementation

on:
  workflow_call:
    inputs:
      trusted:
        required: true
        type: boolean

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    if: github.repository == 'jdx/hk'
    runs-on: ${{ !inputs.trusted && 'ubuntu-latest' || 'namespace-profile-endev-linux-amd64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Mount the local mbx store on the Namespace cache volume
        if: inputs.trusted
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/mbx' || '~/.cache/mbx' }}
      - uses: jdx/mr-boxington-action@867fc530102eec5b756075d70d850dc8330d2272 # v1.4.0
        with:
          backend: ${{ inputs.trusted && 'local' || 'github' }}
          cache-generation: ci-v2
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # The landing page plays the showreel as an MP4 at 120 or 60 fps, and the
      # 60 fps file is also the homepage's og:video. The render depends only on
      # the reel and its renderer, the fonts, the benchmark numbers and the
      # renderer's tool versions, so it is cached on those and rendered again
      # only when one of them changes. The reel's terminal text, hk's version
      # in its headers included, is recorded output kept in the reel's own
      # sources, so a release alone does not render it again. Reusing the
      # video also keeps its versioned URLs stable for link previews, because
      # two renders of the same inputs are not byte-identical. The tool
      # versions are read from their lines rather than by hashing all of
      # aube-lock.yaml, which dependency updates change several times a week;
      # playwright-core's version also fixes the Chromium revision that draws
      # the frames.
      - name: Key the showreel render on its tool versions
        id: showreel-versions
        run: |
          {
            grep -oE '^  (esbuild|playwright-core)@[^:(]+' aube-lock.yaml | sort -u
          } > "$RUNNER_TEMP/showreel-versions"
          cat "$RUNNER_TEMP/showreel-versions"
          echo "hash=$(sha256sum < "$RUNNER_TEMP/showreel-versions" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Only restored here: the trusted build saves a fresh render below, once
      # the site around it has built. The reel's tests (test/**) are not read
      # by the render, so changing only them keeps the cached video.
      - name: Restore the showreel video
        id: showreel
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/public/showreel-120.mp4
            docs/public/showreel.mp4
            docs/public/showreel-poster.jpg
          key: showreel-${{ runner.os }}-${{ steps.showreel-versions.outputs.hash }}-${{ hashFiles('docs/.vitepress/showreel-video.mjs', 'docs/.vitepress/theme/showreel/**', '!docs/.vitepress/theme/showreel/test/**', 'docs/.vitepress/fonts/*.ttf', 'benchmark/results.json') }}
      # A miss renders only in the trusted build, which deploys; the untrusted
      # build then leaves the showreel out, which the site's checks accept.
      # The reel is type-checked and tested, its Chromium tests included,
      # before the minutes-long render, so a broken reel fails before it is
      # drawn rather than in the build that follows.
      - name: Render the showreel video
        if: inputs.trusted && steps.showreel.outputs.cache-hit != 'true'
        timeout-minutes: 30
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          (cd docs && aube install && aube exec playwright-core install --with-deps chromium-headless-shell)
          (cd docs && aube run typecheck && SHOWREEL_REQUIRE_CHROMIUM=1 aube run test:showreel)
          mise run docs:showreel
      - name: Build with VitePress
        run: |
          mise run docs:build
          touch docs/.vitepress/dist/.nojekyll
      - name: Save the showreel video
        if: inputs.trusted && steps.showreel.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            docs/public/showreel-120.mp4
            docs/public/showreel.mp4
            docs/public/showreel-poster.jpg
          key: ${{ steps.showreel.outputs.cache-primary-key }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    if: inputs.trusted && github.repository == 'jdx/hk'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: namespace-profile-endev-linux-amd64
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
