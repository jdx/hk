name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["main"]

permissions: {}

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Verify docs-only policy
        shell: bash
        run: |
          jq -en '[
            {filename: "README.md"},
            {filename: "docs/getting-started.md"},
            {filename: "docs/pirate/STYLE.md"}
          ] | all(.[]; .filename | test("^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\\.md$|^docs/[A-Za-z0-9][A-Za-z0-9._/-]*\\.md$"))' >/dev/null
          printf '%s\n' '[{"filename":"README.md"}]' '[{"filename":"docs/getting-started.md"}]' \
            | jq -es '([.[][]] | length > 0) and all(.[][]; ([.filename, .previous_filename?] | map(select(. != null)) | all(.[]; test("^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\\.md$|^docs/[A-Za-z0-9][A-Za-z0-9._/-]*\\.md$"))))' >/dev/null
          if printf '%s\n' '[{"filename":"README.md"}]' '[{"filename":"src/main.rs"}]' \
            | jq -es '([.[][]] | length > 0) and all(.[][]; ([.filename, .previous_filename?] | map(select(. != null)) | all(.[]; test("^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\\.md$|^docs/[A-Za-z0-9][A-Za-z0-9._/-]*\\.md$"))))'; then
            echo "::error::a non-docs file on a later API page must select full CI"
            exit 1
          fi
          if jq -en '[] | length > 0 and all(.[]; .filename | test("^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\\.md$|^docs/[A-Za-z0-9][A-Za-z0-9._/-]*\\.md$"))'; then
            echo "::error::an empty file list must select full CI"
            exit 1
          fi
          if jq -en '[{filename: "docs/public/Config.pkl"}] | all(.[]; .filename | test("^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\\.md$|^docs/[A-Za-z0-9][A-Za-z0-9._/-]*\\.md$"))'; then
            echo "::error::generated docs inputs must select full CI"
            exit 1
          fi
          if jq -en '[{filename: "src/main.rs"}] | all(.[]; .filename | test("^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\\.md$|^docs/[A-Za-z0-9][A-Za-z0-9._/-]*\\.md$"))'; then
            echo "::error::runtime inputs must select full CI"
            exit 1
          fi
          if jq -en '[{filename: "docs/main.md", previous_filename: "src/main.rs"}] | all(.[]; ([.filename, .previous_filename?] | map(select(. != null)) | all(.[]; test("^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\\.md$|^docs/[A-Za-z0-9][A-Za-z0-9._/-]*\\.md$"))))'; then
            echo "::error::renamed runtime inputs must select full CI"
            exit 1
          fi
      - id: classify
        name: Select CI scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            exit 0
          fi

          files="$RUNNER_TEMP/pr-files.json"
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" > "$files"; then
            echo "::warning::could not list pull request files; running full CI"
            exit 0
          fi
          if [ ! -s "$files" ]; then
            echo "::warning::pull request file list was empty; running full CI"
            exit 0
          fi

          if jq -es '([.[][]] | length > 0) and all(.[][]; ([.filename, .previous_filename?] | map(select(. != null)) | all(.[]; test("^(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY)\\.md$|^docs/[A-Za-z0-9][A-Za-z0-9._/-]*\\.md$"))))' "$files" >/dev/null; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  docs_only:
    name: validate docs-only changes
    needs: changes
    if: ${{ needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          cache_save: false
      - run: mise x -- aube install
      - run: mise run render
      - name: Assert render produces no diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'mise run render' produced changes. Run it locally and commit."
            git status
            git diff HEAD
            exit 1
          fi

  trusted:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && github.actor == 'jdx' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'jdx')) }}
    permissions:
      contents: read
    uses: $/.github/workflows/ci-impl.yml
    with:
      trusted: true

  untrusted:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' && (github.actor != 'jdx' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login != 'jdx'))) }}
    permissions:
      contents: read
    uses: $/.github/workflows/ci-impl.yml
    with:
      trusted: false

  final:
    name: final
    if: ${{ always() && !cancelled() && needs.trusted.result != 'cancelled' && needs.untrusted.result != 'cancelled' }}
    permissions: {}
    needs: [changes, docs_only, trusted, untrusted]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check selected workflow result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_ONLY_RESULT: ${{ needs.docs_only.result }}
          TRUSTED_RESULT: ${{ needs.trusted.result }}
          UNTRUSTED_RESULT: ${{ needs.untrusted.result }}
        run: |
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "changes=$CHANGES_RESULT"
            exit 1
          fi
          if [[ "$DOCS_ONLY" == true ]]; then
            if [[ "$DOCS_ONLY_RESULT" != success ]]; then
              echo "docs_only=$DOCS_ONLY_RESULT"
              exit 1
            fi
            echo "docs-only pull request; full CI intentionally skipped"
            exit 0
          fi
          if [[ "$TRUSTED_RESULT" == success && "$UNTRUSTED_RESULT" == skipped ]] ||
             [[ "$TRUSTED_RESULT" == skipped && "$UNTRUSTED_RESULT" == success ]]; then
            exit 0
          fi
          echo "trusted=$TRUSTED_RESULT untrusted=$UNTRUSTED_RESULT"
          exit 1
