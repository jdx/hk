name: notify-release-failure

# A release is triggered by pushing a tag, so there is no reviewer and no PR
# check: a failed job (a crate that never reached crates.io, a missing binary)
# is silent. Email on failure instead of waiting for a user to report it.
# no permissions, no checkout, and it only fires for completed release runs
# jactionlint ignore=dangerous-triggers
on:
  workflow_run:
    workflows: [release]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  notify:
    name: notify
    if: ${{ github.repository == 'jdx/hk' && contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${NOTIFY_EMAIL:-}" ]; then
            echo "::warning::RESEND_API_KEY or NOTIFY_EMAIL is unset; skipping notification for ${WORKFLOW} on ${TAG}"
            exit 0
          fi
          # Build the payload with jq: --arg keeps a tag or workflow name from
          # breaking out of the JSON string, @html keeps it from becoming markup
          # once the mail client renders the body, and @uri keeps it from
          # reshaping the release URL.
          payload=$(jq -n \
            --arg to "$NOTIFY_EMAIL" \
            --arg workflow "$WORKFLOW" \
            --arg conclusion "$CONCLUSION" \
            --arg tag "$TAG" \
            --arg run_url "$RUN_URL" \
            --arg attempt "$ATTEMPT" \
            --arg repo "$GITHUB_REPOSITORY" \
            '
            ("https://github.com/\($repo)/releases/tag/\($tag | @uri)") as $release_url |
            {
              from: "hk Releases <hk@mise.jdx.dev>",
              to: [$to],
              subject: "❌ hk \($tag): \($workflow) \($conclusion)",
              html: (
                "<p>The <strong>\($workflow | @html)</strong> workflow for <strong>\($tag | @html)</strong> finished with <strong>\($conclusion | @html)</strong> on attempt \($attempt | @html).</p>"
                + "<p>Some of what this release ships may not have gone out. Re-run the failed jobs once the cause is fixed.</p>"
                + "<p><a href=\"\($run_url | @html)\">View workflow run</a> | <a href=\"\($release_url | @html)\">View release</a></p>"
              )
            }')
          # This mail is the only signal that a release half-shipped, so a
          # transient Resend failure must not swallow it. The idempotency key
          # makes a retry of a lost response deliver once.
          curl --fail-with-body -sS \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H "Idempotency-Key: hk-release-failure-${RUN_ID}-${ATTEMPT}" \
            -d "$payload"
