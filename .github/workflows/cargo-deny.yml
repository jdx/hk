name: cargo-deny
on:
  push:
    branches: [main]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/cargo-deny.yml]
  schedule:
    # New RustSec advisories can land without any change in this repository.
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories sources
