name: comment release fixes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  comment:
    permissions:
      contents: read
      pull-requests: read
      issues: write
      discussions: write
    uses: jdx/workflows/.github/workflows/comment-release-fixes.yml@40a9f4239dc9c3c3fb9c58b6be8e93575ef6e72b # v1.1.1
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      marker_prefix: hk-fixed-in
      dry_run: ${{ inputs.dry_run || false }}
