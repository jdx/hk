# Toolset for the competitor benchmark (see README.md in this directory).
#
# Everything a subject runs is pinned here so a refresh changes one variable at
# a time: bump a hook manager and only its bars should move. The linters are the
# workload, not the subject, so they are pinned too — a faster ruff would make
# every tool look faster and shrink the gaps the page reports.
[tools]
"github:jdx/tak" = "v0.0.14"
jq               = "1.8.2"
lefthook         = "2.1.17"
node             = "26.11.1"
"npm:eslint"     = "10.12.0"
"npm:prettier"   = "3.9.9"
"npm:typescript" = "7.0.2"
pre-commit       = "4.6.2"
prek             = "0.5.5"
# pre-commit is a Python zipapp; without a pinned interpreter it would start
# through a mise shim, which rewrites PATH for the fixture directory.
"pipx:black" = "26.10.0"
"pipx:mypy"  = "2.4.0"
# lefthook's whitespace fixers; pre-commit installs the same package from
# .pre-commit-config.yaml.
"pipx:pre-commit-hooks" = "6.0.0"
python                  = "3.14.8"
ruff                    = "0.16.10"
shfmt                   = "3.14.1"
uv                      = "0.12.23"
yq                      = "4.54.1"
