# lefthook, sequential (its default). Safe: one fixer writes at a time.
#
# `fix` fixes without staging and is the all-files scenario. `pre-commit` is
# the same jobs with stage_fixed, matching hk's pre-commit hook. `check` is
# read-only and sequential too, so that check-all shows what lefthook-parallel
# gains over the default.
fix:
  parallel: false
  jobs: &fix
    - name: black
      run: black --quiet {staged_files}
      glob: "*.py"
    - name: ruff-format
      run: ruff format --quiet --force-exclude {staged_files}
      glob: "*.py"
    - name: ruff
      run: ruff check --quiet --force-exclude --fix {staged_files}
      glob: "*.py"
    - name: prettier
      run: prettier --write --log-level warn {staged_files}
      glob: "*.{js,ts,css,md}"
    - name: eslint
      run: eslint --fix {staged_files}
      glob: "*.{js,ts}"
    - name: jq
      run: sh -c 'for f; do t=$(mktemp) && jq -S . "$f" >"$t" && mv "$t" "$f"; done' _ {staged_files}
      glob: "*.json"
    - name: yq
      run: sh -c 'for f; do yq -iP "$f"; done' _ {staged_files}
      glob: "*.{yml,yaml}"
    - name: shfmt
      run: shfmt -w {staged_files}
      glob: "*.sh"
    # lefthook has no built-in fixers; these are pre-commit-hooks' console
    # scripts (pinned in mise.toml), the same fixers pre-commit runs.
    - name: trailing-whitespace
      run: trailing-whitespace-fixer {staged_files}
    - name: newlines
      run: end-of-file-fixer {staged_files}
pre-commit:
  parallel: false
  stage_fixed: true
  jobs: *fix
check:
  parallel: false
  jobs: &check
    - name: black
      run: black --quiet --check {staged_files}
      glob: "*.py"
    - name: ruff-format
      run: ruff format --quiet --force-exclude --check {staged_files}
      glob: "*.py"
    - name: ruff
      run: ruff check --quiet --force-exclude {staged_files}
      glob: "*.py"
    - name: prettier
      run: prettier --check --log-level warn {staged_files}
      glob: "*.{js,ts,css,md}"
    - name: eslint
      run: eslint {staged_files}
      glob: "*.{js,ts}"
    - name: jq
      run: sh -c 'r=0; for f; do jq -S . "$f" | cmp -s "$f" - || r=1; done; exit $r' _ {staged_files}
      glob: "*.json"
    - name: yq
      run: sh -c 'r=0; for f; do yq -P "$f" | cmp -s "$f" - || r=1; done; exit $r' _ {staged_files}
      glob: "*.{yml,yaml}"
    - name: shfmt
      run: shfmt -d {staged_files}
      glob: "*.sh"
    # pre-commit-hooks has no check mode: the fixers exit 1 when they would
    # change a file, and change nothing on a clean tree.
    - name: trailing-whitespace
      run: trailing-whitespace-fixer {staged_files}
    - name: newlines
      run: end-of-file-fixer {staged_files}
