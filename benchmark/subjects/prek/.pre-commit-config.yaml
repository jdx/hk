# prek. The same hooks as ../pre-commit/.pre-commit-config.yaml (setup.sh
# checks that nothing else differs), plus prek's `priority`. Hooks run in
# ascending priority, and hooks that share one run concurrently. A hook without
# one gets its position in this file, so those run one at a time, in order.
#
# Only hooks that write nothing share a priority. Every check hook
# (`--hook-stage manual`) has priority 0, prek's equivalent of lefthook's
# `parallel: true`; the whitespace ones write only on the dirty tree, where
# only the exit code counts (see below). In the fix hooks the fixers keep
# running one at a time:
# prek's documentation warns that hooks in one priority group that modify the
# same files give undefined results. mypy and tsc share priority 100, after
# every fixer, so they run together once no fixer is running.
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black --quiet
        language: system
        types:
          - python
        stages:
          - pre-commit
      - id: ruff-format
        name: ruff-format
        entry: ruff format --quiet --force-exclude
        language: system
        types:
          - python
        stages:
          - pre-commit
      - id: ruff
        name: ruff
        entry: ruff check --quiet --force-exclude --fix
        language: system
        types:
          - python
        stages:
          - pre-commit
      - id: prettier
        name: prettier
        entry: prettier --write --log-level warn
        language: system
        files: \.(js|ts|css|md)$
        stages:
          - pre-commit
      - id: eslint
        name: eslint
        entry: eslint --fix
        language: system
        files: \.(js|ts)$
        stages:
          - pre-commit
      - id: jq
        name: jq
        entry: sh -c 'for f; do t=$(mktemp) && jq -S . "$f" >"$t" && mv "$t" "$f"; done' _
        language: system
        files: \.json$
        stages:
          - pre-commit
      - id: yq
        name: yq
        entry: sh -c 'for f; do yq -iP "$f"; done' _
        language: system
        files: \.ya?ml$
        stages:
          - pre-commit
      - id: shfmt
        name: shfmt
        entry: shfmt -w
        language: system
        files: \.sh$
        stages:
          - pre-commit
      - id: black-check
        name: black (check)
        entry: black --quiet --check
        language: system
        types:
          - python
        priority: 0
        stages:
          - manual
      - id: ruff-format-check
        name: ruff-format (check)
        entry: ruff format --quiet --force-exclude --check
        language: system
        types:
          - python
        priority: 0
        stages:
          - manual
      - id: ruff-check
        name: ruff (check)
        entry: ruff check --quiet --force-exclude
        language: system
        types:
          - python
        priority: 0
        stages:
          - manual
      - id: prettier-check
        name: prettier (check)
        entry: prettier --check --log-level warn
        language: system
        files: \.(js|ts|css|md)$
        priority: 0
        stages:
          - manual
      - id: eslint-check
        name: eslint (check)
        entry: eslint
        language: system
        files: \.(js|ts)$
        priority: 0
        stages:
          - manual
      - id: jq-check
        name: jq (check)
        entry: sh -c 'r=0; for f; do jq -S . "$f" | cmp -s "$f" - || r=1; done; exit $r' _
        language: system
        files: \.json$
        priority: 0
        stages:
          - manual
      - id: yq-check
        name: yq (check)
        entry: sh -c 'r=0; for f; do yq -P "$f" | cmp -s "$f" - || r=1; done; exit $r' _
        language: system
        files: \.ya?ml$
        priority: 0
        stages:
          - manual
      - id: shfmt-check
        name: shfmt (check)
        entry: shfmt -d
        language: system
        files: \.sh$
        priority: 0
        stages:
          - manual
  # The fixers pre-commit's documentation points to. prek runs its bundled
  # Rust implementation of these two instead. They have no check mode: they exit
  # 1 when they change a file, so the manual stage runs them too. They write
  # nothing on the clean tree check-all uses; on the dirty tree (check-detects)
  # only the exit code counts and every sample starts from a reset clone. Each
  # stage lists them separately so prek can run the manual-stage copies
  # concurrently (../prek).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages:
          - pre-commit
      - id: end-of-file-fixer
        stages:
          - pre-commit
      - id: trailing-whitespace
        alias: trailing-whitespace-check
        priority: 0
        stages:
          - manual
      - id: end-of-file-fixer
        alias: end-of-file-fixer-check
        priority: 0
        stages:
          - manual
  # The type checkers write nothing and come last, after every fixer. mypy
  # needs all its files in one process to follow imports (pre-commit's mypy
  # mirror sets require_serial too); tsc checks the whole project.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types:
          - python
        require_serial: true
        priority: 100
        stages:
          - pre-commit
      - id: tsc
        name: tsc
        entry: tsc --noEmit -p tsconfig.json
        language: system
        files: \.ts$
        pass_filenames: false
        priority: 100
        stages:
          - pre-commit
      - id: mypy-check
        name: mypy (check)
        entry: mypy
        language: system
        types:
          - python
        require_serial: true
        priority: 0
        stages:
          - manual
      - id: tsc-check
        name: tsc (check)
        entry: tsc --noEmit -p tsconfig.json
        language: system
        files: \.ts$
        pass_filenames: false
        priority: 0
        stages:
          - manual
