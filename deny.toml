# cargo-deny configuration. PR CI runs `cargo deny check sources`, plus `advisories`
# when the dependency graph changes; a daily workflow checks advisories on main.
# Licenses and duplicate-version bans are intentionally not checked.

[advisories]
# RustSec advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked releases are reported but do not fail the check.
yanked = "warn"

[sources]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
