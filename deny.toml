# cargo-deny configuration. CI runs `cargo deny check advisories sources`.
# Licenses and duplicate-version bans are intentionally not checked.

[advisories]
# RustSec advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked releases are reported but do not fail the check.
yanked = "warn"

[sources]
# The pklr 5.1.0 release candidate is pinned by immutable commit until its
# crates.io release is available. Remove this allowance when the migration
# returns to a published `version = "5"` dependency.
allow-git        = ["https://github.com/jdx/pklr.git"]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
