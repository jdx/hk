# cargo-deny configuration. PR CI runs `cargo deny check sources`, plus `advisories`
# when the dependency graph changes; a daily workflow checks advisories on main.
# Licenses and duplicate-version bans are intentionally not checked.

[advisories]
# RustSec advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked releases are reported but do not fail the check.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained - all versions affected, no safe upgrade available; transitive via expr-lang (chrono-tz), rmcp and schemars" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained - transitive via expr-lang, no safe upgrade available" },
]
yanked = "warn"

[sources]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
# pklr is pinned to a branch until jdx/pklr#495 is released.
allow-git        = ["https://github.com/jdx/pklr"]
unknown-git      = "deny"
unknown-registry = "deny"
