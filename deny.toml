# cargo-deny configuration. CI runs `cargo deny check advisories sources`.
# Licenses and duplicate-version bans are intentionally not checked.

[advisories]
# RustSec advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# Yanked releases are reported but do not fail the check.
yanked = "warn"

[sources]
# pklr v5 is temporarily pinned to an immutable upstream candidate commit until
# its crates.io release is available.
allow-git        = ["https://github.com/jdx/pklr.git"]
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
unknown-git      = "deny"
unknown-registry = "deny"
