flow-x:auto}.tabs button{padding:0 9px}nav button:first-child{display:none}.review-panel{padding:20px 14px}.summary-strip{grid-template-columns:1fr}.diagnostic-list article{grid-template-columns:30px 1fr}.diagnostic-list .message{grid-column:2}}@media(prefers-color-scheme:light){:root{background:#fff;color:#172033;--surface: #fff;--surface-raised: #fbfcfe;--surface-soft: #f8fafc;--surface-code: #f5f7fa;--line: #d5dae3;--line-soft: #e4e7ec;--muted: #6f7a8d}.icon-button,.live-footer button,nav button,.panel-title input{border-color:#ccd3de;background:#fff}.progress{background:#e7ebf0}.live-steps{background:#f8fafc}pre{color:#334155}.tabs b{background:#e7ebf0}.diagnostic-list article>b{background:#fff2cf;color:#9a5b00}.diagnostic-list article>b.error{background:#ffdce0;color:#a61b35}.patch-panel pre{color:#17683c}}@media(prefers-reduced-motion:reduce){.progress i,.live-steps .running .dot,.status.running i{animation:none;transition:none}}@keyframes pulse{50%{opacity:.35}}@keyframes indeterminate{0%{transform:translate(-110%)}to{transform:translate(310%)}}</style>
